<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broastify · Escanea la carta</title>
<!--
  Cartel A4 con QR para imprimir.
  El QR apunta a esta URL (para cambiarla, regenera el QR):
  https://alexaquintanilla.github.io/carta-broastify/
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe2c6; --paper-2:#f6ead0; --card:#fffdf3;
  --ink:#1d1813; --ink-soft:#7e6f58;
  --orange:#ef7d00; --orange-deep:#cf6a00; --red:#c8211f;
  --hair:#e1d3b4;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Figtree',system-ui,sans-serif;color:var(--ink);
  background:#2a221b;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:28px;
}

/* ---------- A4 sheet ---------- */
.sheet{
  width:210mm;max-width:100%;aspect-ratio:210/297;
  background-color:var(--paper);
  background-image:radial-gradient(rgba(80,45,0,.05) 1px,transparent 1.4px);
  background-size:22px 22px;
  position:relative;overflow:hidden;
  box-shadow:0 30px 70px -30px rgba(60,30,0,.6);
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
  padding:clamp(26px,5vw,64px) clamp(22px,5vw,56px);
}
.sheet::before{
  content:"";position:absolute;top:0;left:0;right:0;height:9px;
  background:linear-gradient(90deg,var(--red),var(--orange) 50%,var(--red));
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.sheet::after{
  content:"";position:absolute;width:300px;height:300px;right:-120px;bottom:-120px;
  border-radius:46% 54% 60% 40%/52% 44% 56% 48%;
  background:var(--orange);opacity:.1;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}

/* ---------- brand ---------- */
.brand{position:relative;z-index:1;display:inline-flex;align-items:center;gap:14px;margin-top:6px}
.flame{width:clamp(34px,7vw,52px);height:auto;flex:none}
.logo{
  font-family:'Anton',sans-serif;font-size:clamp(52px,12vw,104px);line-height:.86;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink);
}
.logo b{color:var(--red);font-weight:400}
.tagline{
  font-family:'Caveat',cursive;font-size:clamp(24px,5vw,38px);
  color:var(--orange-deep);margin-top:8px;position:relative;z-index:1;
}

/* ---------- headline ---------- */
.headline{
  font-family:'Anton',sans-serif;text-transform:uppercase;
  font-size:clamp(28px,6vw,52px);letter-spacing:.02em;line-height:1.02;
  color:var(--ink);margin-top:clamp(20px,4vw,40px);position:relative;z-index:1;
}
.headline b{color:var(--orange-deep);font-weight:400}

/* ---------- QR card ---------- */
.qr-card{
  position:relative;z-index:1;border-radius:28px;
  background:linear-gradient(135deg,var(--orange),var(--red));
  padding:clamp(12px,2.4vw,18px);margin-top:clamp(20px,4vw,36px);
  box-shadow:0 22px 46px -26px rgba(60,30,0,.6);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.qr-inner{
  background:#fff;border-radius:16px;padding:clamp(16px,3vw,26px);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.qr-card svg{
  display:block;width:clamp(220px,42vw,360px);height:auto;
  shape-rendering:crispEdges;
}
.qr-card svg path{fill:#14110d}

.hint{
  font-size:clamp(15px,2.6vw,20px);font-weight:600;color:var(--ink-soft);
  margin-top:clamp(16px,3vw,26px);max-width:30ch;position:relative;z-index:1;
}
.hint b{color:var(--orange-deep);font-weight:800}

/* ---------- contact strip ---------- */
.meta{
  margin-top:auto;padding-top:clamp(20px,4vw,34px);
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;
  font-size:clamp(12px,2.2vw,15px);font-weight:500;color:var(--ink);
  position:relative;z-index:1;
}
.meta span{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.6);
  border:1px solid var(--hair);padding:6px 14px;border-radius:999px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.meta b{color:var(--orange-deep);font-weight:700}
.meta svg{width:15px;height:15px;flex:none;color:var(--red)}

/* ---------- print ---------- */
@page{size:A4;margin:0}
@media print{
  body{background:#fff;padding:0;display:block}
  .sheet{width:210mm;height:297mm;max-width:none;aspect-ratio:auto;box-shadow:none;margin:0}
}
</style>
